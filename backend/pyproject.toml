[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# golden_set was documented as opt-in ("Run explicitly: pytest -m golden_set")
# but nothing actually excluded it — found live (2026-07-16) when a plain
# `pytest` run silently spent real Groq/OpenRouter quota and failed on a
# noisy live-model pass-rate assertion unrelated to the change being tested.
addopts = "-m 'not golden_set'"
markers = [
    "golden_set: manual pre-launch quality gate — makes real Groq/OpenRouter calls, spends real quota, takes real wall-clock time. Never run in CI (none exists). Run explicitly: pytest -m golden_set",
]
