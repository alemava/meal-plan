function markAllBought() {
  var meals = (G.week && G.week.meals) || [];
  meals.forEach(function(meal) {
    (meal.ingredients || []).forEach(function(ing) {

        if (G.shopState[k] !== 'avail') G.shopState[k] = 'bought';

  renderShopList(G.week);

var _DAY_OFF      = {Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6};
var _MONTHS       = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var _MONTHS_FULL  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var _WEEKDAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var _SHORT_DAY    = {Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu',Friday:'Fri',Saturday:'Sat',Sunday:'Sun'};
var _THIS_YEAR    = new Date().getFullYear();
function _mealDate(weekStart, label) {
  if (!weekStart) return null;
  var d = new Date(weekStart + 'T12:00:00');
  d.setDate(d.getDate() + (_DAY_OFF[label] || 0));
  return d;
}
function _mealTs(weekStart, label) {
  var d = _mealDate(weekStart, label); return d ? d.getTime() : 0;
}
function _fmtDate(weekStart, label) {
  var d = _mealDate(weekStart, label);
  if (!d) return label || '';
  var s = d.getDate() + ' ' + _MONTHS[d.getMonth()];
  if (d.getFullYear() !== _THIS_YEAR) s += ' ' + d.getFullYear();
  return s;
}
// "Tuesday, May 20" — full weekday + month name, year omitted unless not this year
function _fmtDateFull(weekStart, label) {
  var d = _mealDate(weekStart, label);
  if (!d) return label || '';
  var s = _WEEKDAYS_FULL[d.getDay()] + ', ' + _MONTHS_FULL[d.getMonth()] + ' ' + d.getDate();
  if (d.getFullYear() !== _THIS_YEAR) s += ' ' + d.getFullYear();
  return s;
}

function renderLib() {
  var q   = G.libQ.trim().toLowerCase();
  var rxn = window._libReactions || {};

  // build all items, newest first
  var items = [];
  (window._libAllWeeks || []).forEach(function(week) {
    (week.meals || []).forEach(function(m) {
      items.push({ id: week.id + '-' + m.id, meal_id: m.id, week_id: week.id, week_start: week.week_start, meal: m });
    });
  });
  items.sort(function(a, b) { return _mealTs(b.week_start, b.meal.label) - _mealTs(a.week_start, a.meal.label); });

  if (q) {
    items = items.filter(function(f) {
      return (f.meal.title || '').toLowerCase().indexOf(q) !== -1

  }

  var html = '';
  html += '<input class="sinput" type="search" placeholder="Search recipes…" value="' + esc(G.libQ) + '" oninput="libSearch(this.value)" style="margin-bottom:14px">';

  html += '<div class="lib-tabs">';
  html += '<button class="ltab' + (!G.libFilter ? ' on' : '') + '" onclick="libFilterSet(null)">All</button>';
  [{k:'fav',i:'❤️'},{k:'like',i:'👍'},{k:'dislike',i:'👎'}].forEach(function(f) {
    html += '<button class="ltab' + (G.libFilter === f.k ? ' on' : '') + '" onclick="libFilterSet(\'' + f.k + '\')">' + f.i + '</button>';
  });

  } else {
    items.forEach(function(f) {
      var m      = f.meal;

      var sub    = [];

      html += '<div class="card">';

// ── Reactions ────────────────────────────────────────────────────
function updateRxnWidget(mealId, reaction) {
  var w = document.getElementById('rxn-' + mealId);
  if (!w) return;
  var btns = Array.from(w.querySelectorAll('.rxn-btn'));

  // Cancel any pending cleanup (handlers/timers only — leave DOM intact so
  // prevLefts below captures the current frozen positions).
  if (w._rxnCancel) { w._rxnCancel(); w._rxnCancel = null; }

  // Capture visual positions BEFORE any DOM change
  var prevLefts = btns.map(function(b) { return b.getBoundingClientRect().left; });
  var spread = Math.max.apply(null, prevLefts) - Math.min.apply(null, prevLefts);

  ['like','fav','dis'].forEach(function(r) {
    var btn = w.querySelector('.rxn-' + r);
    if (btn) btn.classList.toggle('sel', (r === 'dis' ? 'dislike' : r) === reaction);
  });
  w.className = 'rxn' + (reaction ? ' has-sel clicking just-clicked' : (spread > 10 ? ' just-clicked' : ''));

  if (spread > 10) {
    // Freeze current visual order via inline order styles
    btns.slice()
        .sort(function(a, b) { return prevLefts[btns.indexOf(a)] - prevLefts[btns.indexOf(b)]; })
        .forEach(function(btn, i) { btn.style.order = i; });

    var _moveHandler = null;
    var _jct = null;

    // _rxnCancel: cancel handlers/timers only, DOM stays for next updateRxnWidget
    w._rxnCancel = function() {
      if (_moveHandler) { document.removeEventListener('mousemove', _moveHandler); _moveHandler = null; }
      if (_jct) { clearTimeout(_jct); _jct = null; }
    };

    function _rxnCleanup() {
      w._rxnCancel = null;
      if (_moveHandler) { document.removeEventListener('mousemove', _moveHandler); _moveHandler = null; }
      if (_jct) { clearTimeout(_jct); _jct = null; }

      // Read positions while frozen, then release
      var oldLefts = btns.map(function(b) { return b.getBoundingClientRect().left; });
      btns.forEach(function(b) { b.style.order = ''; });
      w.classList.remove('clicking', 'just-clicked');

      // FLIP-animate every button that moved to its new CSS position.
      // For a selection: non-sel are invisible so only sel matters.
      // For a deselect: all three rearrange back to DOM order — animate all.
      btns.forEach(function(btn, i) {
        if (reaction && !btn.classList.contains('sel')) return;
        var dx = oldLefts[i] - btn.getBoundingClientRect().left;
        if (Math.abs(dx) > 1) {
          var base = btn.classList.contains('sel') ? 'scale(1.1)' : '';
          btn.style.transition = 'none';
          btn.style.transform = (base ? base + ' ' : '') + 'translateX(' + dx + 'px)';
          void btn.getBoundingClientRect();
          btn.style.transition = '';
          btn.style.transform = base;
        }
      });
    }

    _jct = setTimeout(_rxnCleanup, 2000);
    setTimeout(function() {
      if (!w.classList.contains('just-clicked')) return;
      _moveHandler = function(e) {
        var r = w.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
          _rxnCleanup();
        }
      };
      document.addEventListener('mousemove', _moveHandler);
    }, 50);
  }
}

async function setReaction(mealId, reaction) {
  var meal = (G.week.meals || []).find(function(m) { return m.id === mealId; });
  if (!meal) return;

  var prev = G.reactionMap[mealId] || null;
  var next = (prev === reaction) ? null : reaction;

  // optimistic update
  if (next) G.reactionMap[mealId] = next; else delete G.reactionMap[mealId];
  G.favSet = new Set(Object.keys(G.reactionMap).filter(function(k) { return G.reactionMap[k] === 'fav'; }));
  updateRxnWidget(mealId, next);
  updateNavTabLabel(mealId);

  var id = G.week.id + '-' + mealId;
  try {
    if (!next) {
      await sbFetch('/rest/v1/favourites?id=eq.' + encodeURIComponent(id), {
        method: 'DELETE', headers: {'Prefer': 'return=minimal'}
      });
    } else if (!prev) {
      await sbFetch('/rest/v1/favourites', {
        method: 'POST', headers: {'Prefer': 'return=minimal'},
        body: JSON.stringify({ id: id, meal_id: mealId, week_id: G.week.id, week_title: G.week.title, meal: meal, reaction: next })
      });
    } else {
      await sbFetch('/rest/v1/favourites?id=eq.' + encodeURIComponent(id), {
        method: 'PATCH', headers: {'Prefer': 'return=minimal'},
        body: JSON.stringify({ reaction: next })
      });
    }
  } catch(e) {
    // rollback
    if (prev) G.reactionMap[mealId] = prev; else delete G.reactionMap[mealId];
    G.favSet = new Set(Object.keys(G.reactionMap).filter(function(k) { return G.reactionMap[k] === 'fav'; }));
    updateRxnWidget(mealId, prev);
    updateNavTabLabel(mealId);
  }
}

function updateNavTabLabel(mealId) {
  var meal = (G.week.meals || []).find(function(m) { return m.id === mealId; });
  if (!meal) return;
  var navBtn = document.getElementById('wnb-' + mealId);
  if (!navBtn) return;
  navBtn.innerHTML = mealTabLabel(meal);
}

// ── PWA: Service worker + offline indicator ──────────────────────
if ('serviceWorker' in navigator) {
  function showUpdateModal() {
    var modal = document.getElementById('update-modal');
    if (modal) modal.style.display = 'flex';
  }
  // This page's own HTML was just served fresh over the network, so a SW
  // update detected within a few seconds of load is just the SW catching up
  // to what's already on screen — not something the user needs to act on.
  // Only updates found later (while the tab stays open) warrant the banner.
  var swReadyAt = Date.now();
  var SW_GRACE_MS = 5000;
  function trackInstallingSW(sw) {
    sw.addEventListener('statechange', function() {
      if (sw.state === 'installed' && navigator.serviceWorker.controller) {
        if (Date.now() - swReadyAt < SW_GRACE_MS) return;
        showUpdateModal();
      }
    });
  }
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    // Currently installing
    if (reg.installing) {
      trackInstallingSW(reg.installing);
    }
    // Future updates detected while page is open
    reg.addEventListener('updatefound', function() {
      if (reg.installing) trackInstallingSW(reg.installing);
    });
  }).catch(function(e) {
    console.warn('SW registration failed:', e);
  });
}
function setOffline(offline) {
  var bar = document.getElementById('offline-bar');
  if (bar) bar.style.display = offline ? 'block' : 'none';
}
window.addEventListener('online',  function() { setOffline(false); });
window.addEventListener('offline', function() { setOffline(true); });
if (!navigator.onLine) setOffline(true);

// When app returns from background, recalculate timers from wall clock.
// Fixes setInterval freeze on iOS and background throttling on Android/desktop.
async function refreshWeeks() {
  try {
    var weeks = await sbFetch('/rest/v1/meal_weeks?select=id,title,subtitle,week_type,week_start&order=week_start.asc');
    var thisMonday = thisWeekMonday();
    var past    = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'past'; });
    var current = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'current'; });
    var future  = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'future'; });
    var shown   = past.slice(-1).concat(current).concat(future.slice(0,1));

    // update carousel if week list changed
    var oldIds = (G.weeks || []).map(function(w) { return w.id; }).join(',');
    var newIds = weeks.map(function(w) { return w.id; }).join(',');
    G.weeks = weeks;
    if (oldIds !== newIds) renderWeekCarousel(shown, thisMonday);

    // check if current week has new meals (fetch only meals column)
    if (G.week) {
      var freshArr = await sbFetch('/rest/v1/meal_weeks?id=eq.' + encodeURIComponent(G.week.id) + '&select=id,meals');
      var freshMeals = (freshArr && freshArr[0] && freshArr[0].meals) || [];
      if (freshMeals.length !== (G.week.meals || []).length) {
        G.week.meals = freshMeals;
        renderDayNav(G.week); // add new meal tabs without disrupting current view
      }
    }
  } catch(e) { /* silent fail — don't disrupt the user */ }
}

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible') return;
  syncWakeLock(); // re-request if timers are still running (OS releases lock on background)
  refreshWeeks(); // silently refresh week list in case new recipes were uploaded
  Object.keys(G.timers).forEach(function(k) {
    var t = G.timers[k];
    if (!t || !t.running || !t.startedAt) return;
    var elapsed = Math.floor((Date.now() - t.startedAt) / 1000);
    t.remaining = Math.max(0, t.remainingAtStart - elapsed);
    updateTimerDisplay(k);
    renderStickyBar();
    if (t.remaining <= 0) {
      t.remaining = 0;
      stopTimer(k);
      updateTimerDisplay(k);
      updateTimerButtons(k);
      renderStickyBar();
    }
  });
});
</script>
