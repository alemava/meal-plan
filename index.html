<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="mesa">
<link rel="apple-touch-icon" href="icon.svg">
<title>mesa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf6f0;        /* warm cream body */
  --wht:#ffffff;       /* white cards */
  --srf:#f4efe7;       /* secondary warm surface */
  --txt:#1a1612;       /* warm near-black */
  --mut:#6b6258;       /* warm muted */
  --hnt:#a89f93;       /* warm hint */
  --acc:#c0562a;       /* terracotta primary */
  --acd:#9e4620;       /* terracotta dark hover */
  --acl:#fef0ea;       /* terracotta soft bg */
  --acb:#f5d9ca;       /* terracotta soft border */
  --grn:#52735b;       /* sage green */
  --gnb:#eaf0ec;       /* sage soft bg */
  --gnc:#b8cdbc;       /* sage border */
  --red:#b8352e;
  --brd:#ece6db;       /* warm subtle divider */
  --brd2:#d9d2c5;      /* stronger warm border */
  --nvy:#1a1612;       /* dark fallback */
  --shd:0 1px 2px rgba(26,22,18,0.04),0 1px 3px rgba(26,22,18,0.06);
  --shd2:0 4px 20px rgba(26,22,18,0.08);
}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

header{background:var(--bg);border-bottom:1px solid var(--brd);padding:14px 18px 10px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px}
.happ{display:block;height:26px;width:auto}
.htagline{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--hnt);border-left:1.5px solid var(--brd2);padding-left:10px;line-height:1}
.hcook-lbl{display:none;align-items:center;gap:5px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border-left:1.5px solid var(--brd2);padding-left:10px;line-height:1}
.cook-exit{display:none;margin-left:auto;border:1px solid var(--acb);background:var(--acl);color:var(--acc);font-size:.72rem;font-weight:700;border-radius:8px;padding:5px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;transition:background .15s}
.cook-exit:hover{background:var(--acb)}
.cook-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;background:var(--acc);color:#1a1a1a;font-weight:700;font-size:.9rem;border-radius:12px;padding:13px 16px;cursor:pointer;margin:14px 0 2px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:opacity .15s}
.cook-btn:active{opacity:.8}
.cook-btn svg{width:18px;height:18px;flex-shrink:0}
body.cooking-mode .htagline{display:none}
body.cooking-mode .hcook-lbl{display:flex}
body.cooking-mode .cook-exit{display:flex;align-items:center}
body.cooking-mode .bnav{display:none!important}
body.cooking-mode .cook-btn{display:none}
body.cooking-mode .wknav{display:none!important}
body.cooking-mode .wnav{display:none!important}
body.cooking-mode{padding-bottom:0!important;min-height:0}
/* week tab carousel — underline style */
.wknav{display:flex;background:var(--bg);border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 18px;gap:0;align-items:stretch;justify-content:center}
.wknav::-webkit-scrollbar{display:none}
.wktab{padding:10px 16px 9px;border:none;background:none;font-size:.73rem;font-weight:600;color:var(--hnt);cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;border-bottom:2px solid transparent;transition:color .15s;letter-spacing:0}
.wktab:hover{color:var(--txt)}
.wktab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.shop-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mark-all-btn{font-size:.72rem;font-weight:600;color:var(--acc);background:none;border:1px solid var(--acb);border-radius:8px;padding:5px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.mark-all-btn:hover{background:var(--acl)}

.wnav{display:flex;background:var(--bg);border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:10px 14px;gap:6px;align-items:center}
.wnav::-webkit-scrollbar{display:none}
.wnb{padding:8px 15px;border:1px solid var(--brd2);background:var(--wht);font-size:.78rem;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;border-radius:999px;transition:all .15s ease;letter-spacing:-0.01em}
.wnb:hover{border-color:var(--hnt);color:var(--txt)}
.wnb.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.wnb.shop-tab{background:var(--wht);color:var(--grn);border-color:var(--gnc)}
.wnb.shop-tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.wnb.special-tab{background:var(--wht);color:#8a5a1e;border-color:#e8d9bf}
.wnb.special-tab.on{background:#8a5a1e;color:#fff;border-color:#8a5a1e}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--wht);border-top:1px solid var(--brd);display:flex;z-index:100;height:62px;padding:6px 10px 8px}
.bnb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--hnt);border-radius:12px;margin:0 3px;transition:background .15s}
.bnb.on{color:var(--txt);background:var(--srf)}
.bico{font-size:1.25rem;line-height:1}
.bnlbl{font-size:.64rem;text-transform:none;letter-spacing:-0.01em;font-weight:600}

#offline-bar{display:none;background:var(--red);color:#fff;font-size:.72rem;font-weight:600;text-align:center;padding:6px 12px;position:sticky;top:0;z-index:99;letter-spacing:0}
#update-banner{display:none;background:var(--gnb);border-bottom:1px solid var(--gnc);padding:11px 16px;position:sticky;top:0;z-index:98;animation:ibfade .35s ease}
.ub-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ub-icon{font-size:1.2rem;flex-shrink:0;line-height:1}
.ub-text{flex:1;font-size:.77rem;line-height:1.4;color:var(--txt)}
.ub-text b{font-weight:700;color:var(--grn)}
.ub-text span{font-size:.71rem;color:var(--mut)}
.ub-close{background:none;border:none;color:var(--mut);font-size:1rem;cursor:pointer;padding:4px 6px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;line-height:1;flex-shrink:0;border-radius:6px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.ub-close:hover{color:var(--txt);background:var(--gnc)}
#install-banner{display:none;background:var(--gnb);border-bottom:1px solid var(--gnc);padding:11px 16px;position:sticky;top:0;z-index:97;animation:ibfade .35s ease}
@keyframes ibfade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ib-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ib-icon{flex-shrink:0;line-height:1;color:var(--grn)}
.ib-icon svg{width:24px;height:24px;display:block}
.ib-text{flex:1;font-size:.77rem;line-height:1.4;color:var(--txt)}
.ib-text b{font-weight:700;color:var(--txt)}
.ib-text .ib-steps{font-size:.71rem;color:var(--mut);margin-top:2px}
.ib-share-ico{display:inline-block;vertical-align:middle;width:14px;height:14px;margin:0 1px;position:relative;top:-1px}
.ib-install{background:var(--grn);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:.76rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;transition:background .15s;letter-spacing:-0.01em}
.ib-install:hover{background:#3d5c45}
.ib-close{background:none;border:none;color:var(--mut);font-size:1rem;cursor:pointer;padding:4px 6px;-webkit-tap-highlight-color:transparent;line-height:1;flex-shrink:0;border-radius:6px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.ib-close:hover{color:var(--txt);background:var(--gnc)}
.content{max-width:680px;margin:0 auto;padding:20px 18px}
.err-box{background:var(--acl);border:1px solid var(--acb);border-radius:12px;padding:14px;margin-bottom:14px;font-size:.74rem;color:var(--red);white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;gap:12px;color:var(--mut);font-size:.85rem}
.spin{width:28px;height:28px;border:2.5px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.slbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;color:var(--mut)}
.slbl.acc{color:var(--acc)}.slbl.grn{color:var(--grn)}.slbl.gry{color:var(--hnt)}
.shop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.shop-ttl{font-size:1.25rem;font-weight:700;letter-spacing:-0.02em}
.shop-sts{font-size:.76rem;color:var(--mut);font-weight:500}
.slist{list-style:none;background:var(--wht);border:1px solid var(--brd);border-radius:14px;padding:4px 14px;box-shadow:var(--shd);margin-bottom:18px}
.si{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--brd);-webkit-tap-highlight-color:transparent}
.si:last-child{border-bottom:none}
.si.bought{opacity:.45}
.si.tp{cursor:pointer}
.chk{width:22px;height:22px;flex-shrink:0;border-radius:7px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg);transition:all .15s}
.si.avail .chk{border-color:var(--grn);background:var(--gnb);color:var(--grn)}
.si.tobuy .chk{border-color:var(--acc);background:var(--wht);color:var(--acc)}
.si.bought .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.sn{font-size:.895rem;flex:1;line-height:1.45;color:var(--txt);font-weight:500}
.si.bought .sn{text-decoration:line-through;color:var(--hnt)}
.sn-qty-line{font-size:.78rem;color:var(--mut);font-weight:400}
.sn-qty-line b{color:var(--txt);font-weight:600}
.stag{font-size:.66rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:-0.01em}
.tav{background:var(--gnb);color:var(--grn)}.ttb{background:var(--acl);color:var(--acc)}.tbt{background:var(--srf);color:var(--mut)}

.rw{position:relative;background:var(--wht);border:1px solid var(--brd);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shd)}
.fbtn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:1.5rem;cursor:pointer;padding:4px;z-index:2;-webkit-tap-highlight-color:transparent;line-height:1;color:var(--acc)}
.rtitle{font-size:1.2rem;font-weight:700;line-height:1.3;padding-right:36px;letter-spacing:-0.02em;color:var(--txt)}
.rmeta-date{font-size:.72rem;color:var(--mut);font-weight:500;margin:3px 0 6px}
.rmeta{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;align-items:center}
.pill{background:none;padding:0;font-size:.76rem;color:var(--mut);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.pill::before{content:"·";color:var(--hnt);margin-right:8px;font-weight:700}
.pill:first-child::before{display:none}
.pill.wk{color:var(--acc);font-weight:600}

section{margin-bottom:24px}
.ing-list{list-style:none;background:var(--wht);border:1px solid var(--brd);border-radius:14px;padding:4px 16px;box-shadow:var(--shd)}
.ii{display:flex;align-items:flex-start;gap:10px;font-size:.87rem;line-height:1.5;padding:10px 0;border-bottom:1px solid var(--brd)}
.ii:last-child{border-bottom:none}
.ico{width:20px;height:20px;flex-shrink:0;margin-top:1px;border-radius:6px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ii.iav .ico{background:var(--gnb);color:var(--grn)}
.ii.itb .ico{background:var(--acl);color:var(--acc)}
.ii.ibt .ico{background:var(--gnb);color:var(--grn)}
.itag{font-size:.67rem;font-weight:600;margin-left:4px;padding:2px 7px;border-radius:999px;white-space:nowrap;display:inline-block}
.itag.av{color:var(--grn);background:var(--gnb)}
.itag.tb{color:var(--acc);background:var(--acl)}
.itag.bt{color:var(--grn);background:var(--gnb)}

.plain-list{list-style:none;background:var(--wht);border:1px solid var(--brd);border-radius:14px;padding:4px 16px;box-shadow:var(--shd)}
.plain-item{display:flex;align-items:center;gap:11px;font-size:.87rem;line-height:1.45;padding:11px 0;border-bottom:1px solid var(--brd);cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--txt);font-weight:500}
.plain-item:last-child{border-bottom:none}
.plain-item.ticked{opacity:.45}
.plain-item.ticked .plain-name{text-decoration:line-through}
.plain-chk{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--grn);background:var(--bg)}
.plain-item.ticked .plain-chk{background:var(--gnb);border-color:var(--grn)}

.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--wht);border:1px solid var(--brd);border-radius:14px;padding:16px 18px;box-shadow:var(--shd)}
.step-title{font-size:.95rem;font-weight:700;line-height:1.3;color:var(--txt);margin-bottom:3px;letter-spacing:-0.015em}
.srem{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:6px}
.stxt{font-size:.89rem;line-height:1.6;color:var(--txt)}
.timers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.trow{display:flex;align-items:center;gap:10px;background:var(--acl);border:1px solid var(--acb);border-radius:12px;padding:10px 12px;transition:background .4s,border-color .4s,box-shadow .2s}
.trow.running{box-shadow:0 4px 18px rgba(26,22,18,0.14)}
.trow.done{background:var(--gnb);border-color:var(--grn);animation:tdone-pulse 1.6s ease-in-out .35s infinite}
.trow.done .tdisp{color:var(--grn)}
.trow.done .tlbl b{color:var(--grn)}
@keyframes tdone-pulse{0%,100%{box-shadow:0 0 0 0 rgba(82,115,91,0)}50%{box-shadow:0 0 0 6px rgba(82,115,91,0.22)}}
.tlbl{font-size:.76rem;color:var(--mut);flex:1;line-height:1.35}
.tlbl b{font-weight:600;color:var(--txt)}
.tdisp{font-size:.95rem;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;letter-spacing:-0.02em}
.tbtn{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--acc);background:var(--wht);color:var(--acc);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tbtn svg{width:14px;height:14px;pointer-events:none}
.tbtn:hover{background:var(--acl)}
.tbtn.run{background:var(--acc);color:#fff;border-color:var(--acc)}
.tbtn.run:hover{background:var(--acd);border-color:var(--acd)}
.tbtn:disabled{border-color:var(--gnc);color:var(--grn);background:var(--gnb);cursor:default}
.tbtn.trst{border-color:var(--brd2);color:var(--mut);background:var(--wht)}
.tbtn.trst:hover{background:var(--srf)}
@media(max-width:899px){.tlbl-total{display:none}}
.alertmsg{font-size:.78rem;font-weight:600;color:var(--acd);margin-top:8px;padding:8px 12px;background:var(--acl);border-left:3px solid var(--acc);border-radius:8px}

.rembox{background:var(--srf);border:1px solid var(--brd2);border-radius:14px;padding:14px 16px;box-shadow:var(--shd)}
.remlist{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.remitem{background:var(--wht);border:1px solid var(--brd);border-radius:999px;padding:4px 11px;font-size:.74rem;color:var(--mut);font-weight:500}

.lib-intro{background:var(--wht);border:1px solid var(--brd);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:.82rem;color:var(--mut);line-height:1.55;box-shadow:var(--shd)}
.lib-intro strong{color:var(--txt);font-weight:600}
.lib-tabs{display:flex;gap:8px;margin-bottom:16px}
.ltab{padding:7px 16px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid var(--brd2);background:var(--wht);color:var(--mut);-webkit-tap-highlight-color:transparent;transition:all .15s}
.ltab:hover{border-color:var(--hnt);color:var(--txt)}
.ltab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.ltab.s{border-color:#e8d9bf;color:#8a5a1e}
.ltab.s.on{background:#8a5a1e;color:#fff;border-color:#8a5a1e}

.card{background:var(--wht);border:1px solid var(--brd);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shd);transition:box-shadow .15s}
.card:hover{box-shadow:var(--shd2)}
.card-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-info{flex:1;min-width:0}
.card-ttl{font-size:.9rem;font-weight:600;line-height:1.35;color:var(--txt);letter-spacing:-0.01em}
.card-sub{font-size:.72rem;color:var(--mut);margin-top:3px;font-weight:500}
.chev{font-size:.85rem;color:var(--hnt);transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}
.card-body{display:none;padding:4px 16px 16px;border-top:1px solid var(--brd)}
.card-body.open{display:block}

.sinput{width:100%;padding:11px 16px;border:1px solid var(--brd2);border-radius:12px;font-size:.89rem;background:var(--wht);outline:none;-webkit-appearance:none;color:var(--txt);font-family:inherit;transition:all .15s;box-shadow:var(--shd)}
.sinput::placeholder{color:var(--hnt)}
.sinput:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(192,86,42,0.12)}
.empty{color:var(--hnt);font-size:.87rem;padding:20px 4px;text-align:center}

#sticky-bar{position:fixed;top:55px;left:0;right:0;z-index:98;display:none;padding:0 18px;pointer-events:none}
.stk-inner{max-width:680px;margin:0 auto;padding:8px 0;pointer-events:all}
.stk-row{display:flex;align-items:center;gap:10px;background:var(--acl);border:1px solid var(--acb);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:0 4px 16px rgba(26,22,18,0.13)}
.stk-row:last-child{margin-bottom:0}
.stk-lbl{font-size:.76rem;font-weight:600;flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk-disp{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right;color:var(--acc);letter-spacing:-0.02em}
.stk-x{border:none;background:none;color:var(--hnt);font-size:1rem;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;line-height:1;flex-shrink:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.stk-x:hover{background:var(--srf);color:var(--txt)}
.stk-act{border:1.5px solid var(--brd2);background:var(--wht);color:var(--txt);font-size:.78rem;font-weight:600;cursor:pointer;padding:0 14px;height:44px;min-width:44px;border-radius:10px;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;letter-spacing:-0.01em}
.stk-act:hover{background:var(--srf)}
.stk-act.run{background:var(--acc);border-color:var(--acc);color:#fff}
.stk-act.run:hover{background:var(--acd)}
.stk-act.sq{width:44px;padding:0;font-size:1.1rem}
.stk-rst{border-color:transparent;background:none;color:var(--mut);font-weight:500}
.stk-rst:hover{background:var(--srf);color:var(--txt)}
@media (min-width:900px){
  .content{max-width:980px}
  .rw-cols{display:grid;grid-template-columns:5fr 7fr;gap:28px;align-items:start;margin-top:14px}
  .rw-left>section:first-child,.rw-right>section:first-child{margin-top:0!important}
  .stk-act{height:34px;font-size:.73rem;padding:0 12px}

<body>

</div>

<main class="content" id="main">
  <div class="loader"><div class="spin"></div><span>Loading…</span></div>
</main>

    <span class="bico">📚</span><span class="bnlbl">All recipes</span>
  </button>
</nav>

<script>
// ── Install banner device icons ──────────────────────────────────
var ICO_PHONE   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/></svg>';
var ICO_TABLET  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="2.5"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/></svg>';
var ICO_DESKTOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="13" rx="2"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>';

// ── Install prompt capture (must be early) ───────────────────────
window.deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  window.deferredInstallPrompt = e;
  // If banner is already initialised, update it now
  if (typeof initInstallBanner === 'function') initInstallBanner();
});

// ── Error handlers ───────────────────────────────────────────────
window.onerror = function(msg, src, line) {
  document.getElementById("main").innerHTML =
    '<div class="err-box">JS Error:\n' + msg + '\nLine ' + line + '</div>';
};
window.onunhandledrejection = function(e) {
  document.getElementById("main").innerHTML =
    '<div class="err-box">Promise error:\n' + String(e.reason) + '</div>';
};

// ── Supabase config ──────────────────────────────────────────────
var SB   = "https://vcluruaueetktctdyplh.supabase.co";
var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjbHVydWF1ZWV0a3RjdGR5cGxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMzUxNDgsImV4cCI6MjA5MDgxMTE0OH0.224fBOE3ItykxaGxwDHAugm-5_DWLoiPmn4PA1llaRE";
var SBH  = {"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON};

// ── Supabase helpers ─────────────────────────────────────────────
async function sbFetch(path, opts) {
  opts = opts || {};
  var ctrl = new AbortController();
  var tid = setTimeout(function() { ctrl.abort(); }, 8000);
  try {
    var merged = {headers: SBH, signal: ctrl.signal};
    if (opts.method) merged.method = opts.method;
    if (opts.body)   merged.body   = opts.body;
    if (opts.headers) merged.headers = Object.assign({}, SBH, opts.headers);
    var r = await fetch(SB + path, merged);
    clearTimeout(tid);
    if (!r.ok) throw new Error(r.status + ' ' + await r.text());
    return r.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

// ── Global state ─────────────────────────────────────────────────
var G = {
  weeks: [],
  week: null,
  day: null,
  shopState: {},
  favSet: new Set(),
  timers: {},
  observers: {},        // IntersectionObservers keyed by timer key
  view: 'plan',
  libTab: 'favs',
  libQ: '',
  isPast: false,        // true when the loaded week is a past week
  vvBotOffset: 0,       // px to add to fixed bottom elements (visualViewport compensation)
  cookingMode: false    // true = screen wake lock active, bottom nav hidden
};

// ── Visual viewport sync (iOS/Chrome browser-chrome slide bug) ───
function syncViewport() {
  var vv = window.visualViewport;
  if (!vv) return;
  // Clamp offsetTop to ≥0 so iOS rubber-band overscroll (negative offsetTop)
  // doesn't mistakenly inflate the bottom offset and lift the nav bar.
  var offset = Math.max(0, Math.round(window.innerHeight - Math.max(0, vv.offsetTop) - vv.height));
  G.vvBotOffset = offset;
  var bnav = document.getElementById('bnav');
  if (bnav) bnav.style.bottom = offset ? offset + 'px' : '';
  repositionFloatingTimers();
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}

// ── Utilities ────────────────────────────────────────────────────
function ingKey(name) {
  return name.replace(/[^a-z0-9]/gi, '').toLowerCase();
}

function fmtTime(secs) {
  var m = Math.floor(secs / 60);
  var s = secs % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// Returns this week's Monday as YYYY-MM-DD in local time (avoids UTC shift bugs)
function thisWeekMonday() {
  var d   = new Date();
  var day = d.getDay();                    // 0=Sun … 6=Sat
  var diff = day === 0 ? -6 : 1 - day;    // steps back to Monday
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  var mm  = mon.getMonth() + 1;
  var dd  = mon.getDate();
  return mon.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm + '-' + (dd < 10 ? '0' : '') + dd;
}

// Classify a week as 'current' | 'past' | 'future' purely from week_start
function weekRelative(weekStart, thisMonday) {
  if (!weekStart) return 'past';
  if (weekStart === thisMonday) return 'current';
  return weekStart < thisMonday ? 'past' : 'future';
}

// Parse "Tuesday April 8 Dinner: Spanish Garlic Chicken" → {dish, meta}
function parseTitle(title) {
  if (!title) return { dish: '', meta: '' };
  var idx = title.indexOf(': ');
  if (idx === -1) return { dish: title, meta: '' };
  var dish  = title.slice(idx + 2).trim();
  var before = title.slice(0, idx).trim(); // e.g. "Tuesday April 8 Dinner"
  var parts  = before.split(' ');
  var mealType = parts[parts.length - 1];             // "Dinner"
  var dateStr  = parts.slice(0, -1).join(' ');        // "Tuesday April 8"
  var meta = mealType + (dateStr ? ' · ' + dateStr : '');
  return { dish: dish, meta: meta };
}

// Format week_start "YYYY-MM-DD" → "7–11 Apr"  (Mon–Fri of that week)
function fmtWeekRange(weekStart) {
  if (!weekStart) return '?';
  var mon = new Date(weekStart + 'T12:00:00');
  var fri = new Date(mon); fri.setDate(fri.getDate() + 4);
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monStr = mon.getDate();
  var friStr = fri.getDate() + ' ' + months[fri.getMonth()];
  // span two months? show both; span two years? show year on fri
  if (mon.getFullYear() !== fri.getFullYear()) {
    friStr += ' ' + fri.getFullYear();
  }
  return monStr + '–' + friStr;
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function setMain(html) {
  document.getElementById('main').innerHTML = html;
}

function loader() {
  setMain('<div class="loader"><div class="spin"></div><span>Loading…</span></div>');
}

// ── Install banner ───────────────────────────────────────────────
function initInstallBanner() {
  // Never show if already installed (standalone / fullscreen)
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (window.navigator.standalone === true) return;          // iOS standalone
  // Never show if user already dismissed
  if (localStorage.getItem('mesa-install-dismissed')) return;

  var banner = document.getElementById('install-banner');
  var textEl = document.getElementById('ib-text');
  var installBtn = document.getElementById('ib-install-btn');
  var iconEl = document.getElementById('ib-icon');
  if (!banner || !textEl) return;

  var ua = navigator.userAgent;
  var isIOS      = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
  var isIPad     = /ipad/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid  = /android/i.test(ua);
  var hasTouch   = navigator.maxTouchPoints > 0;
  var isDesktop  = !hasTouch || (/windows|macintosh|linux/i.test(ua) && !isIPad && navigator.maxTouchPoints === 0);
  var isTablet   = !isDesktop && (isIPad || (isAndroid && window.innerWidth >= 600));
  var isMacSafari = /macintosh/i.test(ua) && /safari/i.test(ua) && !/chrome|chromium|edg/i.test(ua) && !isIPad;

  // Pick SVG icon based on real device type
  if (iconEl) {
    if (isDesktop)     iconEl.innerHTML = ICO_DESKTOP;
    else if (isTablet) iconEl.innerHTML = ICO_TABLET;
    else               iconEl.innerHTML = ICO_PHONE;
  }

  var ICO_IOS_SHARE = '<svg class="ib-share-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,7 12,3 16,7"/><line x1="12" y1="3" x2="12" y2="16"/><path d="M8 11H5v10h14V11h-3"/></svg>';

  if (isIOS) {
    // ALL iOS browsers (Safari, Chrome, Firefox) — WebKit, manual only
    textEl.innerHTML =
      '<b>Get the full experience</b>' +
      '<div class="ib-steps">Add to your Home Screen. Instant access, even without internet</div>' +
      '<div class="ib-steps" style="margin-top:4px">Tap ' + ICO_IOS_SHARE + ' then <b>"Add to Home Screen"</b></div>';
    installBtn.style.display = 'none';
    banner.style.display = 'block';
  } else if (isMacSafari) {
    // macOS Safari 17+ — manual via File menu
    textEl.innerHTML =
      '<b>Get the full experience</b>' +
      '<div class="ib-steps">Add to your Dock. Instant access, even without internet</div>' +
      '<div class="ib-steps" style="margin-top:4px">In Safari: <b>File</b> → <b>"Add to Dock…"</b></div>';
    installBtn.style.display = 'none';
    banner.style.display = 'block';
  } else if (window.deferredInstallPrompt) {
    // Chrome / Edge / Android — native prompt available
    var subtitle = 'Install the app. Instant access, even without internet';
    textEl.innerHTML =
      '<b>Get the full experience</b>' +
      '<div class="ib-steps">' + subtitle + '</div>';
    installBtn.style.display = '';
    banner.style.display = 'block';
  }
  // Firefox and other unsupported browsers: don't show anything
}

function dismissInstallBanner() {
  localStorage.setItem('mesa-install-dismissed', '1');
  var banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'none';
}

function triggerInstall() {
  var prompt = window.deferredInstallPrompt;
  if (!prompt) return;
  prompt.prompt();
  prompt.userChoice.then(function(choice) {
    window.deferredInstallPrompt = null;
    dismissInstallBanner();
  });
}

// ── Init ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);

async function init() {
  initInstallBanner();
  try {
    var weeks = await sbFetch('/rest/v1/meal_weeks?select=id,title,subtitle,week_type,week_start&order=week_start.asc');
    G.weeks = weeks;
    var thisMonday = thisWeekMonday();

    // build carousel: up to 2 past + current + 1 future
    var past    = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'past'; });
    var current = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'current'; });
    var future  = weeks.filter(function(w) { return weekRelative(w.week_start, thisMonday) === 'future'; });
    var shown   = past.slice(-1).concat(current).concat(future.slice(0,1));
    renderWeekCarousel(shown, thisMonday);

    // pick current week, fallback to most recent
    var cur = current[0] || weeks[weeks.length - 1];
    if (cur) {
      await loadWeek(cur.id);
    } else {
      setMain('<div class="empty">No meal plans found.</div>');
    }
  } catch(e) {
    setMain('<div class="err-box">Failed to load weeks:\n' + e.message + '</div>');
  }
}

function renderWeekCarousel(shown, thisMonday) {
  var nav = document.getElementById('wknav');
  if (!nav) return;
  if (shown.length <= 1) { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  nav.innerHTML = shown.map(function(w) {
    var isCur = weekRelative(w.week_start, thisMonday) === 'current';
    var lbl   = fmtWeekRange(w.week_start);
    return '<button class="wktab' + (isCur ? ' on' : '') + '" id="wktab-' + esc(w.id) + '" onclick="switchWeek(\'' + esc(w.id) + '\')">' + lbl + '</button>';
  }).join('');
}

async function switchWeek(id) {
  if (G.week && G.week.id === id) return;
  // stop all running timers
  Object.keys(G.timers).forEach(stopTimer);
  G.timers = {};
  await loadWeek(id);
}

// ── Load week ────────────────────────────────────────────────────
async function loadWeek(id) {
  loader();
  try {
    var results = await Promise.all([
      sbFetch('/rest/v1/meal_weeks?id=eq.' + encodeURIComponent(id) + '&select=*'),
      sbFetch('/rest/v1/shopping_state?week_id=eq.' + encodeURIComponent(id) + '&select=state'),
      sbFetch('/rest/v1/favourites?week_id=eq.' + encodeURIComponent(id) + '&select=meal_id')
    ]);

    var weekArr = results[0];
    if (!weekArr || !weekArr.length) {
      setMain('<div class="err-box">Week not found.</div>');
      return;
    }
    G.week = weekArr[0];
    G.shopState = (results[1] && results[1][0] && results[1][0].state) || {};
    G.favSet = new Set((results[2] || []).map(function(f) { return f.meal_id; }));
    G.isPast = weekRelative(G.week.week_start, thisWeekMonday()) === 'past';

    // highlight active carousel tab
    document.querySelectorAll('.wktab').forEach(function(b) { b.classList.remove('on'); });
    var activeTab = document.getElementById('wktab-' + G.week.id);
    if (activeTab) { activeTab.classList.add('on'); activeTab.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }

    // render day nav (shopping tab only for current/future weeks)
    renderDayNav(G.week);
    if (G.week.meals && G.week.meals.length) {
      var autoDay = todayMealId(G.week.meals) || G.week.meals[0].id;
      showDay(autoDay);
    } else {
      setMain('<div class="empty">No meals this week.</div>');
    }
    G.view = 'plan';
    document.getElementById('bp').classList.add('on');
    document.getElementById('bl').classList.remove('on');
  } catch(e) {
    setMain('<div class="err-box">Failed to load week:\n' + e.message + '</div>');
  }
}

// ── Day navigation ───────────────────────────────────────────────
function mealTabLabel(m) {
  if (m.meal_type === 'special') {
    // special dishes: just show the dish name with a star, no day prefix
    return (G.favSet.has(m.id) ? '♥ ' : '⭐ ') + esc(m.label);
  }
  var heart  = G.favSet.has(m.id) ? '♥ ' : '';
  var suffix = m.meal_type === 'breakfast' ? ' 🌅 Breakfast'
             : m.meal_type === 'lunch'     ? ' 🍽 Lunch'
             : m.meal_type === 'dinner'    ? ' 🍽 Dinner'
             : '';
  return heart + esc(m.label) + suffix;
}

function renderDayNav(week) {
  var nav   = document.getElementById('wnav');
  var meals = week.meals || [];
  // Shopping tab first, then regular meals, then specials at the end
  var regular  = meals.filter(function(m) { return m.meal_type !== 'special'; });
  var specials = meals.filter(function(m) { return m.meal_type === 'special'; });
  var ordered  = regular.concat(specials);
  var html = G.isPast ? '' : '<button class="wnb shop-tab" id="wnb-shop" onclick="showShop()">🛒 Shopping</button>';
  html += ordered.map(function(m) {
    var extra = m.meal_type === 'special' ? ' special-tab' : '';
    return '<button class="wnb' + extra + '" id="wnb-' + esc(m.id) + '" onclick="showDay(\'' + esc(m.id) + '\')">'
      + mealTabLabel(m) + '</button>';
  }).join('');
  nav.innerHTML = html;
}

function todayMealId(meals) {
  var dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var today    = dayNames[new Date().getDay()];
  // specials are never auto-selected on load
  var matches  = meals.filter(function(m) { return m.label === today && m.meal_type !== 'special'; });
  if (!matches.length) return null;
  if (matches.length === 1) return matches[0].id;
  // Multiple meals today — pick by time of day
  // breakfast: before 12:00 · lunch: 12:00–17:59 · dinner: 18:00+
  var hour = new Date().getHours();
  var preferred = hour < 12 ? 'breakfast' : hour < 18 ? 'lunch' : 'dinner';
  var pick = matches.find(function(m) { return m.meal_type === preferred; });
  if (pick) return pick.id;
  // fallback: closest meal in time order (breakfast < lunch < dinner)
  var order = ['breakfast', 'lunch', 'dinner'];
  var sorted = matches.slice().sort(function(a, b) {
    return order.indexOf(a.meal_type) - order.indexOf(b.meal_type);
  });
  // past the last meal of the day → show the last one
  return sorted[sorted.length - 1].id;
}

function setNavActive(id) {
  var nav = document.getElementById('wnav');
  nav.querySelectorAll('.wnb').forEach(function(b) { b.classList.remove('on'); });
  var btn = document.getElementById('wnb-' + id);
  if (btn) {
    btn.classList.add('on');
    // Scroll the tab strip so the active tab is horizontally centred
    var navRect = nav.getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    nav.scrollLeft += btnRect.left - navRect.left - (navRect.width - btnRect.width) / 2;
  }
}

// ── Recipe view ──────────────────────────────────────────────────
function showDay(dayId) {
  G.day = dayId;
  setNavActive(dayId);
  // Clean up any floating timers from previous meal view
  Object.keys(G.observers).forEach(disconnectTimerObserver);
  var meal = (G.week.meals || []).find(function(m) { return m.id === dayId; });
  if (!meal) { setMain('<div class="empty">Meal not found.</div>'); return; }
  setMain('<div class="rw">' + renderRecipe(meal) + '</div>');
  bindTimers(meal);
}

function renderRecipe(meal) {
  var isFav = G.favSet.has(meal.id);
  var pt    = parseTitle(meal.title);
  var html  = '';

  // fav button
  html += '<button class="fbtn" id="fbtn-' + esc(meal.id) + '" onclick="toggleFav(' + "'" + esc(meal.id) + "'" + ')" title="' + (isFav ? 'Remove favourite' : 'Add favourite') + '">'
    + (isFav ? '♥' : '♡') + '</button>';

  // dish title (part after the colon)
  html += '<div class="rtitle">' + esc(pt.dish || meal.title) + '</div>';
  // meal type + date metadata ("Dinner · Tuesday April 8")
  if (pt.meta) html += '<div class="rmeta-date">' + esc(pt.meta) + '</div>';
  // pills
  html += '<div class="rmeta">';
  if (meal.time)   html += '<span class="pill">⏱ ' + esc(meal.time) + '</span>';
  if (meal.kcal)   html += '<span class="pill">🔥 ' + esc(meal.kcal) + ' kcal</span>';
  if (meal.people) html += '<span class="pill">👥 ' + esc(meal.people) + ' ' + (meal.people === 1 ? 'person' : 'people') + '</span>';
  html += '</div>';

  // Start cooking CTA — only on devices that support the Wake Lock API
  if ('wakeLock' in navigator) {
    html += '<button class="cook-btn" onclick="enterCookingMode()">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16 10,8" fill="currentColor" stroke="none"/></svg>'
          + 'Start cooking</button>';
  }

  // ── left column: ingredients ──────────────────────────────────
  var ingHtml = '';
  if (meal.ingredients && meal.ingredients.length) {
    ingHtml += '<section style="margin-top:14px;margin-bottom:0">';
    ingHtml += '<div class="slbl acc">Ingredients</div>';
    if (G.isPast) {
      // past week: plain tappable list, no availability badges
      ingHtml += '<ul class="plain-list">';
      meal.ingredients.forEach(function(ing) {
        var k = 'past-' + meal.id + '-' + ingKey(ing.name);
        var ticked = G.shopState[k] === 'ticked';
        ingHtml += '<li class="plain-item' + (ticked ? ' ticked' : '') + '" onclick="togglePastIng(\'' + esc(k) + '\')">'
          + '<span class="plain-chk">' + (ticked ? '✓' : '') + '</span>'
          + '<span class="plain-name">' + esc(ing.name)
          + (ing.qty ? ' <span style="font-weight:400;color:var(--mut)">' + esc(ing.qty) + '</span>' : '')
          + '</span></li>';
      });
      ingHtml += '</ul>';
    } else {
      // current/future week: full availability badges
      ingHtml += '<ul class="ing-list">';
      meal.ingredients.forEach(function(ing) {
        var key   = ingKey(ing.name);
        var state = G.shopState[key];
        var cls, icon, tagCls, tagTxt;
        if (ing.avail) {
          cls = 'iav'; icon = '✓'; tagCls = 'av'; tagTxt = 'Got it';
        } else if (state === 'bought') {
          cls = 'ibt'; icon = '✓'; tagCls = 'bt'; tagTxt = 'Bought';
        } else {
          cls = 'itb'; icon = '•'; tagCls = 'tb'; tagTxt = 'Buy';
        }
        ingHtml += '<li class="ii ' + cls + '">';
        ingHtml += '<span class="ico">' + icon + '</span>';
        ingHtml += '<span>' + esc(ing.name)
          + (ing.qty ? ' <span class="itag" style="background:none;color:var(--mut);font-weight:400;padding:0">' + esc(ing.qty) + '</span>' : '')
          + '<span class="itag ' + tagCls + '"> ' + tagTxt + '</span></span>';
        ingHtml += '</li>';
      });
      ingHtml += '</ul>';
    }
    ingHtml += '</section>';
  }

  // remaining available (also left column)
  var remHtml = '';
  if (meal.remaining && meal.remaining.length) {
    remHtml += '<div class="rembox" style="margin-top:14px;margin-bottom:0">';
    remHtml += '<div class="slbl acc">Remaining after this recipe</div>';
    remHtml += '<ul class="remlist">';
    meal.remaining.forEach(function(r) { remHtml += '<li class="remitem">' + esc(r) + '</li>'; });
    remHtml += '</ul></div>';
  }

  // ── right column: steps ──────────────────────────────────────
  var stepsHtml = '';
  if (meal.steps && meal.steps.length) {
    stepsHtml += '<section style="margin-top:14px;margin-bottom:0">';
    stepsHtml += '<div class="slbl acc">Steps</div>';
    stepsHtml += '<div class="steps">';
    meal.steps.forEach(function(step, si) {
      stepsHtml += '<div class="step">';
      if (step.title) {
        stepsHtml += '<div class="step-title">' + esc(step.title) + '</div>';
        if (step.remaining != null) stepsHtml += '<div class="srem">' + step.remaining + ' min remaining</div>';
      } else if (step.remaining != null) {
        stepsHtml += '<div class="srem">' + step.remaining + ' min remaining</div>';
      }
      stepsHtml += '<div class="stxt">' + (step.text || '') + '</div>';
      if (step.timers && step.timers.length) {
        stepsHtml += '<div class="timers">';
        step.timers.forEach(function(t, ti) {
          var key = meal.id + '-' + si + '-' + ti;
          stepsHtml += '<div class="trow" id="trow-' + esc(key) + '">';
          stepsHtml += '<div class="tlbl"><b>' + esc(t.label) + '</b><span class="tlbl-total"><br>' + fmtTime(t.seconds) + '</span></div>';
          stepsHtml += '<div class="tdisp" id="tdisp-' + esc(key) + '">' + fmtTime(t.seconds) + '</div>';
          stepsHtml += '<button class="tbtn trst" id="trst-' + esc(key) + '" onclick="stickyRestart(\'' + esc(key) + '\')" style="display:none" title="Restart">' + ICO_RST + '</button>';
          stepsHtml += '<button class="tbtn" id="tbtn-' + esc(key) + '" onclick="timerAction(\'' + esc(key) + '\')" title="Start">' + ICO_PLAY + '</button>';
          stepsHtml += '</div>';
          if (t.alertMsg) stepsHtml += '<div class="alertmsg" id="talert-' + esc(key) + '" style="display:none">' + esc(t.alertMsg) + '</div>';
        });
        stepsHtml += '</div>';
      }
      stepsHtml += '</div>';
    });
    stepsHtml += '</div></section>';
  }

  // two-column wrapper — CSS grid activates on desktop (≥900px)
  html += '<div class="rw-cols">';
  html += '<div class="rw-left">'  + ingHtml   + remHtml   + '</div>';
  html += '<div class="rw-right">' + stepsHtml + '</div>';
  html += '</div>';

  return html;
}

// ── Timer icon SVGs ──────────────────────────────────────────────

var ICO_PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>';
var ICO_RST   = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A4.5 4.5 0 1 1 5 11"/><polyline points="3,5 3.5,7.5 6,7"/></svg>';
var ICO_CLOSE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>';

// Single source of truth for timer button state
function updateTimerButtons(key) {
  var t    = G.timers[key];
  var btn  = document.getElementById('tbtn-' + key);
  var rst  = document.getElementById('trst-' + key);
  var trow = document.getElementById('trow-' + key);
  if (!t || !btn) return;
  if (t.remaining === 0) {
    btn.innerHTML = ICO_CLOSE; btn.className = 'tbtn trst'; btn.title = 'Close';
    if (rst) rst.style.display = 'none';
    if (trow) { trow.classList.add('done'); trow.classList.remove('running'); }
  } else {
    if (trow) trow.classList.remove('done');
    if (t.running) {
      btn.innerHTML = ICO_PAUSE; btn.className = 'tbtn run'; btn.title = 'Pause';
      if (rst) rst.style.display = '';
    } else if (t.remaining < t.secs) {
      btn.innerHTML = ICO_PLAY;  btn.className = 'tbtn';     btn.title = 'Resume';
      if (rst) rst.style.display = '';
    } else {
      btn.innerHTML = ICO_PLAY;  btn.className = 'tbtn';     btn.title = 'Start';
      if (rst) rst.style.display = 'none';
    }
  }
}

// Re-stack floating trows after bnav height changes
function repositionFloatingTimers() {
  var hdr    = document.querySelector('header');
  var bnavEl = document.getElementById('bnav');
  var topBase = (hdr    ? hdr.offsetHeight    : 55) + 8;
  var botBase = (bnavEl ? bnavEl.offsetHeight : 62) + 8 + G.vvBotOffset;

  var topFloaters = [], botFloaters = [];
  Object.keys(G.timers).forEach(function(k) {
    var el = document.getElementById('trow-' + k);
    if (!el || el.style.position !== 'fixed') return;
    // Use placeholder page-Y so order always matches recipe order
    var ph = document.getElementById('trow-ph-' + k);
    var pageY = ph ? (ph.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop)) : 0;
    if (el.style.bottom !== '') { botFloaters.push({ el: el, pageY: pageY }); }
    else                        { topFloaters.push({ el: el, pageY: pageY }); }
  });

  // Top stack: first in page → closest to header
  topFloaters.sort(function(a, b) { return a.pageY - b.pageY; });
  var topAcc = topBase;
  topFloaters.forEach(function(item) {
    item.el.style.top = topAcc + 'px';
    topAcc += item.el.offsetHeight + 8;
  });

  // Bottom stack: last in page → closest to nav bar
  botFloaters.sort(function(a, b) { return b.pageY - a.pageY; });
  var botAcc = botBase;
  botFloaters.forEach(function(item) {
    item.el.style.bottom = botAcc + 'px';
    botAcc += item.el.offsetHeight + 8;
  });
}

// Compute rootMargin for a timer's IntersectionObserver, accounting for any
// timers already floating on each side (so newcomers float early to avoid overlap)
function getTimerRootMargin(key) {
  var hdr    = document.querySelector('header');
  var bnavEl = document.getElementById('bnav');
  var topBase = hdr    ? hdr.offsetHeight    : 55;
  var botBase = (bnavEl ? bnavEl.offsetHeight : 62) + G.vvBotOffset;
  var topExtra = 0, botExtra = 0;
  Object.keys(G.timers).forEach(function(k) {
    if (k === key) return;
    var el = document.getElementById('trow-' + k);
    if (!el || el.style.position !== 'fixed') return;
    if (el.style.bottom && el.style.bottom !== '') {
      botExtra += el.offsetHeight + 8;
    } else {
      topExtra += el.offsetHeight + 8;
    }
  });
  return { top: topBase + topExtra, bot: botBase + botExtra };
}

// Re-arm exit observers for all active inline timers with fresh margins.
// Called whenever a timer floats or unFloats so stacking thresholds stay correct.
function refreshTimerObservers() {
  Object.keys(G.timers).forEach(function(k) {
    var t = G.timers[k];
    if (!t || t.dismissed) return;
    if (!t.running && t.remaining === t.secs) return; // not engaged
    var el = document.getElementById('trow-' + k);
    if (!el || el.style.position === 'fixed') return; // skip already-floating
    setupTimerObserver(k);
  });
}

// ── Timers ───────────────────────────────────────────────────────
function bindTimers(meal) {
  if (!meal.steps) return;
  meal.steps.forEach(function(step, si) {
    if (!step.timers) return;
    step.timers.forEach(function(t, ti) {
      var key = meal.id + '-' + si + '-' + ti;
      // preserve running timers when re-rendering same meal
      if (!G.timers[key]) {
        G.timers[key] = {
          secs: t.seconds,
          remaining: t.seconds,
          running: false,
          interval: null,
          alertAt: (t.alertAt != null ? t.alertAt : -1),
          alertMsg: t.alertMsg || null,
          alerted: false,
          label: t.label,
          dismissed: false
        };
      } else {
        G.timers[key].label = t.label; // keep label fresh
      }
      updateTimerDisplay(key);
      updateTimerButtons(key);
      // restore running class and observer
      var st     = G.timers[key];
      var trowEl = document.getElementById('trow-' + key);
      var engaged = st.running || st.remaining !== st.secs;
      if (trowEl) { if (engaged) trowEl.classList.add('running'); else trowEl.classList.remove('running'); }
      if (engaged && !st.dismissed) setupTimerObserver(key);
    });
  });
  renderStickyBar();
}

function timerAction(key) {
  var t = G.timers[key];
  if (!t) return;
  if (t.remaining === 0) {
    // dismiss / reset — unfloat, return to natural position
    t.remaining = t.secs;
    t.alerted   = false;
    t.dismissed = false;
    stopTimer(key);
    updateTimerDisplay(key);
    updateTimerButtons(key);
    var alrtEl = document.getElementById('talert-' + key);
    if (alrtEl) alrtEl.style.display = 'none';
    var trowRst = document.getElementById('trow-' + key);
    if (trowRst) trowRst.classList.remove('running');
    disconnectTimerObserver(key);
    renderStickyBar();
    return;
  }
  if (t.running) {
    // pause
    stopTimer(key);
    updateTimerButtons(key);
  } else {
    // start / resume
    var inlineRow = document.getElementById('trow-' + key);
    if (inlineRow) inlineRow.classList.add('running');
    t.dismissed       = false;
    t.running         = true;
    t.startedAt       = Date.now();       // wall-clock anchor
    t.remainingAtStart = t.remaining;     // remaining when (re)started
    syncWakeLock();
    // If trow is already floating keep the placeholder observer — don't disturb float state
    if (!inlineRow || inlineRow.style.position !== 'fixed') {
      setupTimerObserver(key);
    }
    updateTimerButtons(key);
    t.interval  = setInterval(function() {
      var elapsed = Math.floor((Date.now() - t.startedAt) / 1000);
      t.remaining = Math.max(0, t.remainingAtStart - elapsed);
      updateTimerDisplay(key);
      renderStickyBar();
      // alert check
      if (!t.alerted && t.alertAt >= 0 && t.remaining <= t.alertAt) {
        t.alerted = true;
        if (t.alertMsg) {
          var alrtEl2 = document.getElementById('talert-' + key);
          if (alrtEl2) alrtEl2.style.display = 'block';
        }
      }
      if (t.remaining <= 0) {
        t.remaining = 0;
        stopTimer(key);
        updateTimerDisplay(key);
        updateTimerButtons(key);
        renderStickyBar();
      }
    }, 1000);
  }
  renderStickyBar();
}

function stopTimer(key) {
  var t = G.timers[key];
  if (!t) return;
  if (t.interval) { clearInterval(t.interval); t.interval = null; }
  t.running = false;
  syncWakeLock();
}

// ── Cooking mode ─────────────────────────────────────────────────
function enterCookingMode() {
  G.cookingMode = true;
  document.body.classList.add('cooking-mode');
  syncWakeLock();
}
function exitCookingMode() {
  G.cookingMode = false;
  document.body.classList.remove('cooking-mode');
  syncWakeLock();
}

// ── Screen Wake Lock ─────────────────────────────────────────────
var G_wakeLock = null;
function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  var hasRunning = G.cookingMode || Object.keys(G.timers).some(function(k) {
    return G.timers[k] && G.timers[k].running;
  });
  if (hasRunning && !G_wakeLock) {
    navigator.wakeLock.request('screen').then(function(lock) {
      G_wakeLock = lock;
      lock.addEventListener('release', function() { G_wakeLock = null; });
    }).catch(function() {});
  } else if (!hasRunning && G_wakeLock) {
    G_wakeLock.release();
    G_wakeLock = null;
  }
}

function updateTimerDisplay(key) {
  var t = G.timers[key];
  if (!t) return;
  var el = document.getElementById('tdisp-' + key);
  if (el) el.textContent = fmtTime(t.remaining);
  var sk = document.getElementById('stk-disp-' + key);
  if (sk) sk.textContent = fmtTime(t.remaining);
}

function dismissStickyTimer(key) {
  var t = G.timers[key];
  if (!t) return;
  stopTimer(key);
  disconnectTimerObserver(key);
  t.dismissed = true;
  var trow = document.getElementById('trow-' + key);
  if (t.remaining === 0 || t.remaining === t.secs) {
    if (trow) trow.classList.remove('running');
  }
  updateTimerButtons(key);
  updateTimerDisplay(key);
  renderStickyBar();
}

function timerReset(key) {
  var t = G.timers[key];
  if (!t) return;
  stopTimer(key);
  t.remaining = t.secs;
  t.alerted   = false;
  t.dismissed = true;
  updateTimerDisplay(key);
  updateTimerButtons(key);
  var alrt = document.getElementById('talert-' + key);
  if (alrt) alrt.style.display = 'none';
  var trowEl = document.getElementById('trow-' + key);
  if (trowEl) trowEl.classList.remove('running');
  disconnectTimerObserver(key);
  renderStickyBar();
}

function stickyRestart(key) {
  var t = G.timers[key];
  if (!t) return;
  stopTimer(key);
  t.remaining = t.secs;
  t.alerted   = false;
  var alrt = document.getElementById('talert-' + key);
  if (alrt) alrt.style.display = 'none';
  updateTimerDisplay(key);
  timerAction(key); // resets dismissed flag, hides inline row, starts counting
}

function renderStickyBar() {
  var bar = document.getElementById('sticky-bar');
  if (bar) bar.style.display = 'none';
}

// ── Timer floating (position:fixed when trow leaves viewport) ────
// When a running trow exits the viewport it "hits the wall" and
// stays fixed at the top or bottom. A placeholder holds its space.
// When the user scrolls back, the placeholder re-enters view and
// the trow snaps home.

function setupTimerObserver(key) {
  disconnectTimerObserver(key);
  var trow = document.getElementById('trow-' + key);
  if (!trow || !window.IntersectionObserver) return;

  var mg = getTimerRootMargin(key);

  // Immediate check: if already off-screen, float right away instead of
  // waiting for the async IntersectionObserver initial callback, which can
  // be missed when the element was never intersecting when observe() is called.
  var rect = trow.getBoundingClientRect();
  if (rect.bottom <= mg.top) { floatTrow(key, false); return; }
  if (rect.top >= window.innerHeight - mg.bot) { floatTrow(key, true); return; }

  var obs = new IntersectionObserver(function(entries) {
    if (!entries[0].isIntersecting) {
      var below = entries[0].boundingClientRect.top > window.innerHeight / 2;
      obs.disconnect();
      delete G.observers[key];
      floatTrow(key, below);
    }
  }, { threshold: 0, rootMargin: '-' + mg.top + 'px 0px -' + mg.bot + 'px 0px' });
  obs.observe(trow);
  G.observers[key] = obs;
}

function floatTrow(key, below) {
  var trow = document.getElementById('trow-' + key);
  if (!trow || trow.style.position === 'fixed') return;

  var rect = trow.getBoundingClientRect();

  // Placeholder keeps layout intact
  var ph = document.createElement('div');
  ph.id = 'trow-ph-' + key;
  ph.style.cssText = 'height:' + trow.offsetHeight + 'px;flex-shrink:0;visibility:hidden;pointer-events:none';
  trow.parentNode.insertBefore(ph, trow.nextSibling);

  // Fix the trow exactly where it was horizontally
  trow.style.position = 'fixed';
  trow.style.width    = rect.width + 'px';
  trow.style.left     = rect.left  + 'px';
  trow.style.margin   = '0';
  trow.style.zIndex   = '98';
  // Set side flag; repositionFloatingTimers assigns the exact vertical value
  if (below) { trow.style.bottom = '0'; trow.style.top = ''; }
  else        { trow.style.top   = '0'; trow.style.bottom = ''; }

  // Watch placeholder with the SAME rootMargin used to trigger the float so obsBack
  // doesn't fire immediately (which would cause a flicker loop).
  // Also includes other floating timers' heights so snap-back is correctly gated.
  if (window.IntersectionObserver) {
    var mg_ = getTimerRootMargin(key); // key is now floating, so excludes itself
    var obsBack = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        obsBack.disconnect();
        delete G.observers[key];
        unfloatTrow(key);
        var t2 = G.timers[key];
        if (t2 && !t2.dismissed && (t2.running || t2.remaining !== t2.secs)) {
          setupTimerObserver(key);
        }
        // Refresh all other inline timers — their stacking thresholds changed
        refreshTimerObservers();
        // Restack any remaining floating timers now that one unfloated
        setTimeout(repositionFloatingTimers, 50);
      }
    }, { threshold: 0, rootMargin: '-' + mg_.top + 'px 0px -' + mg_.bot + 'px 0px' });
    obsBack.observe(ph);
    G.observers[key] = obsBack;
  }
  // Position all floating timers by page order, then re-arm inline observers
  repositionFloatingTimers();
  refreshTimerObservers();
}

function unfloatTrow(key) {
  var trow = document.getElementById('trow-' + key);
  var ph   = document.getElementById('trow-ph-' + key);
  if (trow && trow.style.position === 'fixed') {
    trow.style.position = trow.style.width = trow.style.left =
    trow.style.top = trow.style.bottom = trow.style.zIndex = trow.style.margin = '';
  }
  if (ph && ph.parentNode) ph.parentNode.removeChild(ph);
}

function disconnectTimerObserver(key) {
  if (G.observers[key]) { G.observers[key].disconnect(); delete G.observers[key]; }
  unfloatTrow(key);
}

// ── Shopping list helpers ────────────────────────────────────────
function parseQty(q) {
  // parse "200g", "2 tbsp", "1.5 cups" → {num, unit} or null
  var m = String(q || '').trim().match(/^(\d+(?:[.,]\d+)?)\s*(\S+)?$/);
  if (!m) return null;
  return { num: parseFloat(m[1].replace(',', '.')), unit: (m[2] || '').toLowerCase() };
}
function sumQtys(qtys) {
  // returns "500g" if all qtys share the same unit, otherwise null
  if (!qtys || qtys.length < 2) return null;
  var parsed = qtys.map(parseQty);
  if (parsed.some(function(p) { return !p; })) return null;
  var unit = parsed[0].unit;
  if (!parsed.every(function(p) { return p.unit === unit; })) return null;
  var total = parsed.reduce(function(acc, p) { return acc + p.num; }, 0);
  var t = Math.round(total * 100) / 100;
  return (Number.isInteger(t) ? String(t) : t.toString()) + (unit || '');
}

// ── Shopping list ────────────────────────────────────────────────
function showShop() {
  setNavActive('shop');
  G.day = null;
  renderShopList(G.week);
}

function renderShopList(week) {
  var meals = week.meals || [];

  // build unified ingredient map: key → {name, meals:[], avail, qtys:[]}
  var map = {};
  meals.forEach(function(meal) {
    (meal.ingredients || []).forEach(function(ing) {
      var k = ingKey(ing.name);
      if (!map[k]) map[k] = {name: ing.name, meals: [], avail: ing.avail, qtys: []};
      if (map[k].meals.indexOf(meal.label) === -1) map[k].meals.push(meal.label);
      if (ing.avail) map[k].avail = true;
      if (ing.qty) map[k].qtys.push(ing.qty);
    });
  });

  // resolve display status for each key
  var avail = [], tobuy = [], bought = [];
  Object.keys(map).forEach(function(k) {
    var item = map[k];
    var st = G.shopState[k];
    if (item.avail || st === 'avail') {
      avail.push({key: k, item: item});
    } else if (st === 'bought') {
      bought.push({key: k, item: item});
    } else {
      tobuy.push({key: k, item: item});
    }
  });

  var total    = avail.length + tobuy.length + bought.length;
  var doneCount = avail.length + bought.length;

  var html = '<div class="shop-hdr">';
  html += '<div class="shop-ttl">Shopping List</div>';
  html += '<div class="shop-sts">' + doneCount + ' of ' + total + ' bought</div>';
  html += '</div>';

  function renderGroup(items, cls, tagCls, tagTxt, icon, clickable) {
    return items.map(function(entry) {
      var onclick = clickable ? ' onclick="toggleShopItem(\'' + esc(entry.key) + '\')"' : '';
      var qtys = entry.item.qtys || [];
      var qtyHtml = '';
      if (qtys.length === 1) {
        qtyHtml = ' <span class="sn-qty-line">' + esc(qtys[0]) + '</span>';
      } else if (qtys.length > 1) {
        var total   = sumQtys(qtys);
        var detail  = qtys.length + ' recipes: ' + qtys.map(esc).join(' + ');
        qtyHtml = ' <span class="sn-qty-line">'
          + (total ? '<b>' + esc(total) + '</b> · ' : '')
          + detail + '</span>';
      }
      return '<li class="si ' + cls + (clickable ? ' tp' : '') + '"' + onclick + '>'
        + '<div class="chk">' + icon + '</div>'
        + '<div class="sn">' + esc(entry.item.name) + qtyHtml + '</div>'
        + '<span class="stag ' + tagCls + '">' + tagTxt + '</span>'
        + '</li>';
    }).join('');
  }

  if (tobuy.length) {
    html += '<div class="shop-section-hdr">'
      + '<span class="slbl acc" style="margin-bottom:0">To buy</span>'
      + '<button class="mark-all-btn" onclick="markAllBought()">✓ Mark all as bought</button>'
      + '</div>';
    html += '<ul class="slist">' + renderGroup(tobuy, 'tobuy', 'ttb', 'Buy', '', true) + '</ul>';
  }
  if (avail.length) {
    html += '<div class="slbl grn" style="margin-top:16px">Already have</div>';
    html += '<ul class="slist">' + renderGroup(avail, 'avail', 'tav', 'Got it', '✓', false) + '</ul>';
  }
  if (bought.length) {
    html += '<div class="slbl gry" style="margin-top:16px">Bought</div>';
    html += '<ul class="slist">' + renderGroup(bought, 'bought', 'tbt', 'Bought', '✓', true) + '</ul>';
  }
  if (!total) {
    html += '<div class="empty">No ingredients found.</div>';
  }

  setMain(html);
}

function toggleShopItem(key) {
  var cur = G.shopState[key] || 'tobuy';
  G.shopState[key] = (cur === 'tobuy') ? 'bought' : 'tobuy';
  persistShopState();
  renderShopList(G.week);
}

function togglePastIng(key) {
  G.shopState[key] = G.shopState[key] === 'ticked' ? undefined : 'ticked';
  // re-render current recipe
  var meal = (G.week.meals || []).find(function(m) { return m.id === G.day; });
  if (meal) { setMain('<div class="rw">' + renderRecipe(meal) + '</div>'); bindTimers(meal); }
}

function markAllBought() {
  var meals = (G.week && G.week.meals) || [];
  meals.forEach(function(meal) {
    (meal.ingredients || []).forEach(function(ing) {
      if (!ing.avail) {
        var k = ingKey(ing.name);
        if (G.shopState[k] !== 'avail') G.shopState[k] = 'bought';
      }
    });
  });
  persistShopState();
  renderShopList(G.week);
}

async function persistShopState() {
  try {
    await sbFetch('/rest/v1/shopping_state', {
      method: 'POST',
      headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({week_id: G.week.id, state: G.shopState, updated_at: new Date().toISOString()})
    });
  } catch(e) {
    console.warn('Shopping state save failed:', e.message);
  }
}

// ── Week view toggle ─────────────────────────────────────────────
function showWeekView() {
  document.getElementById('bp').classList.add('on');
  document.getElementById('bl').classList.remove('on');
  G.view = 'plan';
  if (G.week) {
    renderDayNav(G.week);
    var day = G.day || (G.week.meals && G.week.meals[0] && G.week.meals[0].id);
    if (day) showDay(day);
  }
}

// ── Library ──────────────────────────────────────────────────────
async function showLib(tab) {
  document.getElementById('bl').classList.add('on');
  document.getElementById('bp').classList.remove('on');
  G.view    = 'lib';
  G.libTab  = tab || 'favs';
  G.libQ    = '';

  // clear day nav
  document.getElementById('wnav').innerHTML = '';
  loader();

  try {
    var results = await Promise.all([
      sbFetch('/rest/v1/favourites?select=*&order=created_at.desc'),
      sbFetch('/rest/v1/meal_weeks?select=id,title,meals,week_start&order=week_start.desc')
    ]);
    window._libAllWeeks = results[1];
    renderLib(results[0]);
  } catch(e) {
    setMain('<div class="err-box">Failed to load library:\n' + e.message + '</div>');
  }
}

function renderLib(favs) {
  var tab  = G.libTab;
  var q    = G.libQ.trim().toLowerCase();

  var html = '';

  // search
  html += '<input class="sinput" type="search" placeholder="Search recipes…" value="' + esc(G.libQ) + '" oninput="libSearch(this.value,window._libFavs)" style="margin-bottom:14px">';

  // tabs
  html += '<div class="lib-tabs">';
  var favKeySet = new Set(favs.map(function(f) { return f.week_id + '-' + f.meal_id; }));
  html += '<button class="ltab' + (tab === 'favs' ? ' on' : '') + '" onclick="libTab(\'favs\',window._libFavs)">♥ Favourites</button>';
  html += '<button class="ltab' + (tab === 'all' ? ' on' : '') + '" onclick="libTab(\'all\',window._libFavs)">📖 All Recipes</button>';
  html += '</div>';

  var items;
  if (tab === 'favs') {
    items = favs;
  } else {
    // all recipes across all weeks
    items = [];
    (window._libAllWeeks || []).forEach(function(week) {
      (week.meals || []).forEach(function(m) {
        items.push({
          id: week.id + '-' + m.id,
          meal_id: m.id,
          week_id: week.id,
          week_title: week.title,
          meal: m
        });
      });
    });
  }

  if (q) {
    items = items.filter(function(f) {
      return (f.meal.title || '').toLowerCase().indexOf(q) !== -1
          || (f.meal.label || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if (!items.length) {
    html += '<div class="empty">No recipes found.</div>';
  } else {
    items.forEach(function(f) {
      var m = f.meal;
      var cardId = 'card-' + esc(f.id);
      html += '<div class="card">';
      html += '<div class="card-hdr" onclick="toggleCard(\'' + esc(cardId) + '\')">';
      html += '<div class="card-info">';
      var isFav = (tab === 'favs') || favKeySet.has(f.week_id + '-' + f.meal_id);
      var pt = parseTitle(m.title);
      html += '<div class="card-ttl">' + (isFav ? '♥ ' : '') + esc(pt.dish || m.title || m.label) + '</div>';
      var sub = [];
      if (pt.meta)  sub.push(pt.meta);
      if (m.time)   sub.push('⏱ ' + m.time);
      if (m.kcal)   sub.push('🔥 ' + m.kcal + ' kcal');
      if (m.people) sub.push('👥 ' + m.people);
      if (f.week_title) sub.push(f.week_title.replace('Meal Plan | ',''));
      html += '<div class="card-sub">' + esc(sub.join(' · ')) + '</div>';
      html += '</div>';
      html += '<span class="chev" id="chev-' + esc(cardId) + '">›</span>';
      html += '</div>';
      html += '<div class="card-body" id="' + esc(cardId) + '">';
      // ingredient list inside card
      if (m.ingredients && m.ingredients.length) {
        html += '<div style="padding-top:10px">';
        html += '<div class="slbl acc">Ingredients</div>';
        html += '<ul class="ing-list">';
        m.ingredients.forEach(function(ing) {
          var cls = ing.avail ? 'iav' : 'itb';
          var icon = ing.avail ? '✓' : '•';
          html += '<li class="ii ' + cls + '"><span class="ico">' + icon + '</span>'
            + esc(ing.name)
            + (ing.qty ? ' <span style="font-size:.75rem;color:var(--mut);font-weight:400">' + esc(ing.qty) + '</span>' : '')
            + '</li>';
        });
        html += '</ul></div>';
      }
      html += '</div></div>';
    });
  }

  window._libFavs = favs;
  setMain(html);
}

function toggleCard(id) {
  var body = document.getElementById(id);
  var chev = document.getElementById('chev-' + id);
  if (!body) return;
  body.classList.toggle('open');
  if (chev) chev.classList.toggle('open');
}

function libTab(tab, favs) {
  G.libTab = tab;
  renderLib(favs || window._libFavs || []);
}

function libSearch(q, favs) {
  G.libQ = q;
  renderLib(favs || window._libFavs || []);
}

// ── Favourites ───────────────────────────────────────────────────
async function toggleFav(mealId) {
  var meal = (G.week.meals || []).find(function(m) { return m.id === mealId; });
  if (!meal) return;

  var btn = document.getElementById('fbtn-' + mealId);
  if (G.favSet.has(mealId)) {
    // remove
    G.favSet.delete(mealId);
    if (btn) btn.textContent = '♡';
    updateNavTabLabel(mealId);
    try {
      await sbFetch('/rest/v1/favourites?id=eq.' + encodeURIComponent(G.week.id + '-' + mealId), {
        method: 'DELETE',
        headers: {'Prefer': 'return=minimal'}
      });
    } catch(e) {
      G.favSet.add(mealId);
      if (btn) btn.textContent = '♥';
      updateNavTabLabel(mealId);
    }
  } else {
    // add
    G.favSet.add(mealId);
    if (btn) btn.textContent = '♥';
    updateNavTabLabel(mealId);
    try {
      await sbFetch('/rest/v1/favourites', {
        method: 'POST',
        headers: {'Prefer': 'return=minimal'},
        body: JSON.stringify({
          id: G.week.id + '-' + mealId,
          meal_id: mealId,
          week_id: G.week.id,
          week_title: G.week.title,
          meal: meal
        })
      });
    } catch(e) {
      G.favSet.delete(mealId);
      if (btn) btn.textContent = '♡';
      updateNavTabLabel(mealId);
    }
  }
}

function updateNavTabLabel(mealId) {
  var meal = (G.week.meals || []).find(function(m) { return m.id === mealId; });
  if (!meal) return;
  var navBtn = document.getElementById('wnb-' + mealId);
  if (!navBtn) return;
  navBtn.innerHTML = mealTabLabel(meal);
}

// ── PWA: Service worker + offline indicator ──────────────────────
if ('serviceWorker' in navigator) {
  function showUpdateBanner() {
    var banner = document.getElementById('update-banner');
    if (!banner) return;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var msg = document.getElementById('ub-msg');
    var refreshBtn = document.getElementById('ub-refresh');
    if (isStandalone) {
      if (msg) msg.textContent = 'Close and reopen the app to update';
      if (refreshBtn) refreshBtn.style.display = 'none';
    } else {
      if (msg) msg.textContent = 'Refresh the page to get the latest version';
      if (refreshBtn) refreshBtn.style.display = '';
    }
    banner.style.display = 'block';
  }
  function trackInstallingSW(sw) {
    sw.addEventListener('statechange', function() {
      if (sw.state === 'installed' && navigator.serviceWorker.controller) {
        showUpdateBanner();
      }
    });
  }
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    // Already waiting (loaded after SW installed but before it activated)
    if (reg.waiting && navigator.serviceWorker.controller) {
      showUpdateBanner();
    }
    // Currently installing
    if (reg.installing) {
      trackInstallingSW(reg.installing);
    }
    // Future updates detected while page is open
    reg.addEventListener('updatefound', function() {
      if (reg.installing) trackInstallingSW(reg.installing);
    });
  }).catch(function(e) {
    console.warn('SW registration failed:', e);
  });
}
function setOffline(offline) {
  var bar = document.getElementById('offline-bar');
  if (bar) bar.style.display = offline ? 'block' : 'none';
}
window.addEventListener('online',  function() { setOffline(false); });
window.addEventListener('offline', function() { setOffline(true); });
if (!navigator.onLine) setOffline(true);

// When app returns from background, recalculate timers from wall clock.
// Fixes setInterval freeze on iOS and background throttling on Android/desktop.
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible') return;
  syncWakeLock(); // re-request if timers are still running (OS releases lock on background)
  Object.keys(G.timers).forEach(function(k) {
    var t = G.timers[k];
    if (!t || !t.running || !t.startedAt) return;
    var elapsed = Math.floor((Date.now() - t.startedAt) / 1000);
    t.remaining = Math.max(0, t.remainingAtStart - elapsed);
    updateTimerDisplay(k);
    renderStickyBar();
    if (t.remaining <= 0) {
      t.remaining = 0;
      stopTimer(k);
      updateTimerDisplay(k);
      updateTimerButtons(k);
      renderStickyBar();
    }
  });
});
</script>
